<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — White Water Rafting WWR</title>
    <meta name="description"
      content="A basic page that gives the contact information of White Water Rafting Company.">
    <meta name="author" content="Pius Ahiave">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="White Water Rafting">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="subhero">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p><a href="email">info@whitewater.com</a></p>
        </div>
        <div id="first">
            <div>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d80794.54731825965!2d-113.1568269326691!3d37.4037821057389!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sgh!4v1785472796069!5m2!1sen!2sgh"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <div class="text">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>
                <div class="email">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="emial" placeholder="johndoe@email.com"
                      required>
                </div>
                <div class="radio">
                    <label>Message Purpose</label>
                    <div class="options">
                        <label for="gi"><input type="radio" id="gi" name="mp">General
                            Inquiry</label>
                        <label for="rq"><input type="radio" id="rq" name="mp">Reservation
                            Question</label>
                        <label for="ws"><input type="radio" id="ws" name="mp">Website
                            Suggestion</label>
                    </div>
                </div>
                <div class="textarea">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>
                <div class="checkbox">
                    <label><input type="checkbox" id="check" name="check">Please Subscribe me to
                        the
                        monthly newsletter</label>
                </div>
                <div class="button">
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </div>
        <section class="next">
            <h2>We Are Here to Serve You</h2>
            <div class="sub">
                <div class="one">
                    <figure>
                        <img src="images/mavis.png" alt="water rafting">
                        <figcaption>Mavis Brown<br>(Secretary)</figcaption>
                    </figure>
                </div>
                <div class="one">
                    <figure>
                        <img src="images/eric.png" alt="water rafting">
                        <figcaption>Eric Smith<br>(Manager)</figcaption>
                    </figure>
                </div>
                <div class="one">
                    <figure>
                        <img src="images/christian.png" alt="water rafting">
                        <figcaption>Chris Rogers<br>(Asst. Manager)</figcaption>
                    </figure>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 💧 White Water Rafting 💧 Pius Ahiave</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="40">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon" width="40">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon" width="40">
            </a>
        </nav>
    </footer>
</body>

</html>
