<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <form>
        <label for="first">1. What does the acronym CSS stand for?</label>
        <input type="text" id="first" name="first" required>
        <label for="second">2. How are id and class attributes selected in CSS?</label>
        <textarea id="second" name="second"></textarea>
        <label for="third">3. Which of the following is a valid CSS comment?</label>
        <select id="third" name="third">
            <option value="" selected disabled>Choose one ...</option>
            <option value="blue">1. Blue</option>
            <option value="red">2. Red</option> 
            <option value="green">3. Green</option>
        </select>
        <label for="fourth">4. What is the bottom margin given this declaration?</label>
        <div id="last">margin: 10px 5px 15px;</div>
        <input type="number" id="fourth" name="fourth">
        <button type="submit">Submit Quiz</button>
    </form>
</body>
</html>
